<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="aurora">
<title>aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="out">
<header class="appbar">
  <h1>aurora</h1>
  <span class="sync" id="sync"></span>
  <button type="button" class="nbtn txt" id="logout">sair</button>
</header>

<form class="sec login" id="login">
  <h3>entrar</h3>
  <input class="in" name="email" type="email" placeholder="seu@email.com" autocomplete="email" aria-label="E-mail" required>
  <input class="in" name="password" type="password" placeholder="senha (mínimo 6 caracteres)" autocomplete="current-password" aria-label="Senha" minlength="6" required>
  <div class="loginbtns">
    <button class="nbtn txt" value="in">entrar</button>
    <button class="nbtn txt ghost" value="up">criar conta</button>
  </div>
  <button type="button" class="add" id="forgot">esqueci a senha</button>
  <p class="loginmsg" id="loginmsg" role="status"></p>
</form>

<div class="wrap">
  <section class="tab" id="tab-cal">
    <div class="monthhead">
      <button type="button" class="nbtn" id="mprev" aria-label="Mês anterior">←</button>
      <h2 id="month"></h2>
      <button type="button" class="nbtn" id="mnext" aria-label="Próximo mês">→</button>
    </div>
    <div class="cal" id="cal"></div>
    <div class="sec" id="day"></div>
  </section>

  <section class="tab" id="tab-book" hidden>
    <details class="sec addbox">
    <summary>+ novo livro</summary>
    <form class="addform" id="addbook">
      <input class="in" name="title" placeholder="título" autocomplete="off" required>
      <input class="in" name="author" placeholder="autor(a)" autocomplete="off">
      <input class="in" name="pages" type="number" min="1" inputmode="numeric" placeholder="nº de páginas">
      <input class="in" name="cover" type="url" placeholder="link da capa (opcional, senão eu procuro)">
      <button class="nbtn txt">criar livro</button>
    </form>
    </details>
    <div class="cards" id="list-book"></div>
  </section>

  <section class="tab" id="tab-podcast" hidden>
    <details class="sec addbox">
    <summary>+ novo podcast</summary>
    <form class="addform addlink" data-kind="podcast">
      <input class="in" name="url" type="url" placeholder="cole o link do episódio" required>
      <label class="chk"><input type="checkbox" name="today" checked> ouvi hoje</label>
      <button class="nbtn txt">adicionar</button>
    </form>
    </details>
    <div class="cards" id="list-podcast"></div>
  </section>

  <section class="tab" id="tab-text" hidden>
    <details class="sec addbox">
    <summary>+ novo texto</summary>
    <form class="addform addlink" data-kind="text">
      <input class="in" name="url" type="url" placeholder="cole o link do artigo" required>
      <label class="chk"><input type="checkbox" name="today" checked> li hoje</label>
      <button class="nbtn txt">adicionar</button>
    </form>
    </details>
    <div class="cards" id="list-text"></div>
  </section>
</div>

<nav class="tabbar" id="tabbar">
  <button type="button" data-tab="tab-cal" aria-pressed="true"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>Dias</button>
  <button type="button" data-tab="tab-book" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c2.5-1 5.5-1 8 .8 2.5-1.8 5.5-1.8 8-.8v13c-2.5-1-5.5-1-8 .8-2.5-1.8-5.5-1.8-8-.8z"/><path d="M12 6.3v13.3"/></svg>Livros</button>
  <button type="button" data-tab="tab-podcast" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3.5" y="14" width="4" height="6" rx="1.5"/><rect x="16.5" y="14" width="4" height="6" rx="1.5"/></svg>Podcasts</button>
  <button type="button" data-tab="tab-text" aria-pressed="false"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h7l4.5 4.5v12.5H7z"/><path d="M14 3.5V8h4.5M9.5 12.5h6M9.5 16h6"/></svg>Textos</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
