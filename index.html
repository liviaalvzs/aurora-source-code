<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbfaf7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>aurora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body class="out">
<header class="appbar">
  <h1>aurora</h1>
  <span class="sync" id="sync"></span>
  <button type="button" class="nbtn txt" id="tod" hidden>hoje</button>
  <button type="button" class="nbtn txt" id="logout">sair</button>
</header>

<form class="sec login" id="login">
  <h3>entrar</h3>
  <p>Digite seu e-mail. Vamos mandar um link para você entrar, sem senha.</p>
  <input class="in" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
  <button class="nbtn txt">enviar link</button>
  <p class="loginmsg" id="loginmsg" role="status"></p>
</form>

<div class="wrap">
  <div class="dayhead">
    <button type="button" class="nbtn" id="prev" aria-label="Dia anterior">←</button>
    <div>
      <span class="label" id="dow"></span>
      <h2 id="date"></h2>
    </div>
    <button type="button" class="nbtn" id="next" aria-label="Próximo dia">→</button>
  </div>
  <div class="week" id="week" aria-label="Últimos 7 dias"></div>

  <main>
    <section class="sec" id="tab-habits">
      <div class="sech"><h3>Hábitos</h3><span class="label" id="hcount"></span></div>
      <ul class="list" id="habits"></ul>
      <form class="addform" id="addhabit">
        <input class="in" name="name" placeholder="novo hábito, ex: beber 2 L de água" autocomplete="off" required>
        <button class="add">+ adicionar</button>
      </form>
    </section>

    <section class="sec" id="tab-reminders" hidden>
      <div class="sech"><h3>Lembretes</h3><span class="label" id="rcount"></span></div>
      <ul class="list" id="reminders"></ul>
      <form class="addform" id="addrem">
        <input class="in time" name="time" type="time" aria-label="Horário (opcional)">
        <input class="in" name="text" placeholder="novo lembrete, ex: tomar vitamina" autocomplete="off" required>
        <button class="add">+ adicionar</button>
      </form>
    </section>
  </main>
</div>

<nav class="tabbar" id="tabbar">
  <button type="button" data-tab="tab-habits" aria-pressed="true"><span class="ico">✓</span>Hábitos</button>
  <button type="button" data-tab="tab-reminders" aria-pressed="false"><span class="ico">◷</span>Lembretes</button>
</nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
